<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2DE2FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8247E5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Left angle bracket < -->
  <polyline points="24 16 12 32 24 48" stroke="url(#gradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right angle bracket > -->
  <polyline points="40 16 52 32 40 48" stroke="url(#gradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- AI text -->
  <text x="32" y="40" font-family="'SF Pro Display', 'Inter', sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="url(#gradient)">AI</text>
</svg>
