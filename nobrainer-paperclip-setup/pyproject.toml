[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nobrainer-paperclip-setup"
version = "0.1.0"
description = "Cross-platform installer and antifragile orchestrator for Paperclip-driven multi-agent development."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "nobrainer-paperclip-setup contributors" }]
keywords = ["paperclip", "agents", "orchestration", "setup", "cross-platform", "jira", "antifragile"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.optional-dependencies]
rich = ["rich>=13"]

[project.scripts]
nobrainer-paperclip-setup = "nobrainer_paperclip_setup.__main__:main"

[tool.setuptools]
packages = [
  "nobrainer_paperclip_setup",
  "nobrainer_paperclip_setup.scheduler",
  "nobrainer_paperclip_setup.actions",
  "nobrainer_paperclip_setup.jira",
  "nobrainer_paperclip_setup.tickets",
  "nobrainer_paperclip_setup.policies",
]
include-package-data = true
