[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nobrainer-browser"
version = "0.1.0"
description = "Cross-platform installer that wires four browser-automation tools (Webwright, Playwright MCP, Playwright CLI, agent-browser) into both Claude Code and Codex CLI with a 7-day npm supply-chain cooldown."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "nobrainer-browser contributors" }]
keywords = ["browser", "automation", "playwright", "webwright", "agent-browser", "mcp", "claude", "codex", "cross-platform"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
nobrainer-browser = "nobrainer_browser.__main__:main"

[tool.setuptools]
packages = [
  "nobrainer_browser",
  "nobrainer_browser.tools",
  "nobrainer_browser.wire",
]
include-package-data = true
