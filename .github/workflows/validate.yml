name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-suite:
    name: Portable suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Validate skill structure
        run: |
          python3 scripts/validate_skills.py
          python3 scripts/validate_skills.py --suite

      - name: Run deterministic tests
        run: python3 -m unittest discover -s tests -v

      - name: Check Python and Bash helpers
        run: |
          python3 -m py_compile scripts/*.py tests/*.py skills/deep-autoreview/scripts/autoreview skills/deep-autoreview/scripts/test-review-harness.py
          bash -n skills/deep-autoreview/scripts/test-review-harness
          bash -n skills/deep-bugs-finder/scripts/bug-hunt

      - name: Parse PowerShell helper
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $path = Resolve-Path 'skills/deep-autoreview/scripts/test-review-harness.ps1'
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Verify checkout remains unchanged
        run: git diff --exit-code
