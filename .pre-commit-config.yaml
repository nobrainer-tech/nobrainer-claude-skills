# Reviewed against the official Gitleaks release on 2026-08-27.
# Run `pre-commit autoupdate` and review the diff before changing the pin.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--ignore-gitleaks-allow"]
  - repo: local
    hooks:
      - id: public-commit-guard
        name: Reject automated identities and backup artifacts
        entry: python3 scripts/check_public_commit.py
        language: system
        pass_filenames: false
